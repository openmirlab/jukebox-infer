name: Test

# Dedicated CI: runs the full pytest suite on every push/PR across the
# Python versions pyproject.toml classifiers claim support for (3.10-3.13),
# plus a wheel-from-sdist build + clean-venv install + import smoke test
# (org constitution article 7). publish.yml keeps its own Python-3.10-only
# `test` job as the release gate (deliberate release-gate simplicity, not
# duplication) -- this workflow is the one that actually exercises the full
# matrix on every change.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --extra dev --python ${{ matrix.python-version }}

      - name: Run tests
        run: uv run --python ${{ matrix.python-version }} pytest -v

  build:
    name: Wheel-from-sdist smoke test
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build package (wheel-from-sdist, org constitution article 7)
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Install wheel into a clean venv and touch public symbols
        run: |
          python -m venv /tmp/smoke-venv
          /tmp/smoke-venv/bin/pip install --upgrade pip
          /tmp/smoke-venv/bin/pip install dist/*.whl
          /tmp/smoke-venv/bin/python -c "
          import jukebox_infer
          from jukebox_infer import Jukebox, download_checkpoints, set_seed, __version__
          print('jukebox_infer', __version__, 'imported OK')
          print('Jukebox class:', Jukebox)
          "

      - name: Confirm the wheel is non-empty and never bundles weights
        run: |
          if unzip -l dist/*.whl | grep -qiE '\.(pth|pt|ckpt|bin|safetensors)$'; then
            echo "::error::Wheel contains a checkpoint-like file -- weights must never be bundled (org constitution article 4)"
            exit 1
          fi
          count=$(unzip -l dist/*.whl | grep -c '\.py$')
          if [ "$count" -lt 5 ]; then
            echo "::error::Wheel looks empty ($count .py files) -- check [tool.hatch.build.targets.wheel] packages"
            exit 1
          fi
          echo "Verified: wheel has $count .py files and no bundled weights"
